name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      # minimal's main branch: the API the next release ships, so a break shows up here first.
      - run: uvx --with textual --from git+https://github.com/RafaSG13/Minimal@main minimal ext check --install-deps .
