name: Textual
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      # minimal's main branch: the API the next release ships, so a break shows up here first.
      - run: uv run --no-project --with git+https://github.com/RafaSG13/Minimal@main --with-editable . python -m unittest discover -s tests
        working-directory: textual
